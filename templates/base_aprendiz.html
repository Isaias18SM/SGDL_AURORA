<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENA Connect - Portal Aprendiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SENA Connect" class="brand-logo">
            </div>
            <ul class="nav-menu">
                <li class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <a href="{{ url_for('aprendiz.dashboard_aprendiz') }}"><i class="ph ph-chart-pie"></i> Dashboard</a>
                </li>
                <li class="nav-item {% if active_page == 'mis_asistencias' %}active{% endif %}">
                    <a href="{{ url_for('aprendiz.asistencia_aprendiz') }}"><i class="ph ph-calendar-check"></i> Mis Asistencias</a>
                </li>
                <li class="nav-item {% if active_page == 'novedades' %}active{% endif %}">
                    <a href="{{ url_for('aprendiz.novedades_aprendiz') }}"><i class="ph ph-paperclip"></i> Justificar Novedad</a>
                </li>
                <li class="nav-item {% if active_page == 'mi_qr' %}active{% endif %}">
                    <a href="{{ url_for('aprendiz.mi_qr') }}"><i class="ph ph-qr-code"></i> Mi Código QR</a>
                </li>
            </ul>

            <!-- Cerrar sesión al fondo -->
            <div style="margin-top: auto;">
                <a href="{{ url_for('auth.logout') }}"
                   style="display:flex; align-items:center; gap:10px; padding:12px 15px; color:var(--danger);
                          text-decoration:none; border-radius:8px; font-size:0.9rem;
                          border: 1px solid rgba(6,95,70,0.25); transition: background 0.2s;"
                   onmouseover="this.style.background='rgba(6,95,70,0.08)'"
                   onmouseout="this.style.background='transparent'">
                    <i class="ph ph-sign-out"></i> Cerrar Sesión
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-bar">
                    <input type="text" placeholder="Buscar competencias, asistencias...">
                </div>
                <div class="user-profile">
                    <div style="text-align: right;">
                        <p style="font-size: 0.9rem; font-weight: 600;">{{ session.get('nombre', 'Aprendiz') }}</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Aprendiz</p>
                    </div>
                    <div class="user-avatar"></div>
                </div>
            </header>
            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
