{% extends 'base.html' %}
{% set active_page = 'config' %}

{% block content %}
<div style="margin-bottom: 30px;">
    <h2>CONFIGURACIÓN</h2>
    <p style="color: var(--text-muted);">Gestiona tu perfil y preferencias del sistema.</p>
</div>

<div class="card">
    <h3>Configuración del Perfil</h3>
    {% if mensaje %}
        {% set tipo, texto = mensaje %}
        <p style="margin-top:12px; padding:10px 14px; border-radius:6px;
                  {% if tipo == 'exito' %}background: rgba(22,163,74,0.12); color: var(--primary);
                  {% else %}background: rgba(6,95,70,0.12); color: var(--danger);{% endif %}">
            {{ texto }}
        </p>
    {% endif %}

    <form method="POST" action="{{ url_for('instructor.configuracion') }}" style="margin-top:15px; display:flex; flex-direction:column; gap:15px;">
        <div>
            <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:5px;">Nombre Completo</label>
             <input type="text" name="nombre" value="{{ user.nombre }}" required style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); padding:10px; border-radius:6px; color:var(--text-white);">
        </div>
        <div>
            <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:5px;">Correo Electrónico</label>
             <input type="email" name="email" value="{{ user.email }}" required  style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); padding:10px; border-radius:6px; color:var(--text-white);">
        </div>
        <button type="submit" style="background:var(--primary); border:none; padding:10px; border-radius:6px; font-weight:bold; color:var(--bg-main);" onClick={handlerGuardarCambios}>Guardar Cambios</button>
    </form>
</div>
{% endblock %}
