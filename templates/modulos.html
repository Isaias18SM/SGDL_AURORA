{% extends 'base.html' %}
{% set active_page = 'reportes' %}

{% block content %}
<div style="margin-bottom: 30px;">
    <h2>REPORTES</h2>
    <p style="color: var(--text-muted);">Estadísticas y métricas de asistencia.</p>
</div>

<div class="dashboard-grid">
    <div class="card" style="grid-column: span 2;">
        <h3>Estadísticas Mensuales de Asistencia</h3>
        <div style="height: 150px; display:flex; align-items:flex-end; gap:15px; margin-top:20px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
            <div style="background:var(--primary); width:100%; height:80%; border-radius:4px 4px 0 0;"></div>
            <div style="background:var(--primary); width:100%; height:45%; border-radius:4px 4px 0 0;"></div>
            <div style="background:var(--primary); width:100%; height:95%; border-radius:4px 4px 0 0;"></div>
            <div style="background:var(--primary); width:100%; height:70%; border-radius:4px 4px 0 0;"></div>
            <div style="background:var(--primary); width:100%; height:85%; border-radius:4px 4px 0 0;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:5px; color:var(--text-muted); font-size:0.8rem;">
            <span>Ene</span><span>Feb</span><span>Mar</span><span>Abr</span><span>May</span>
        </div>
    </div>
</div>
{% endblock %}
